<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>動物音程跳跳樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Lora:ital,wght@1,600&display=swap">
<style>
/* Layout: a songbook page — picker row, then the staff, then the meadow stage, stacked like a textbook exercise. Single light "classroom" theme by choice. */
:root {
  --sky: #e6f1f7;        /* page ground */
  --paper: #ffffff;      /* panels */
  --ink: #23313b;        /* text, staff lines */
  --muted: #5d6d78;
  --line: #cfdde6;
  --grass: #4f9a33;      /* the green grass line */
  --grass-soft: #dcefcf;
  --do: #8a2f86;         /* textbook purple "d" box */
  --jump: #e8781e;       /* jump arcs, like the orange arcs in the book */
  --jump-soft: #f7c99f;
  --focus: #1f6fb2;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "DFKai-SB", "PingFang TC", "Microsoft JhengHei", serif;
  --font-body: "PingFang TC", "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", system-ui, sans-serif;
  --font-solfa: "Lora", "Georgia", "Times New Roman", serif;
  color-scheme: light;
}
html { background: var(--sky); }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.04em;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); font-size: 15px; }
.panel {
  background: var(--paper);
  border-radius: 18px;
  padding: 16px 18px 18px;
  display: grid;
  gap: 12px;
  min-width: 0;
  box-shadow: 0 1px 0 var(--line);
}
.panel h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.step {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  font-family: var(--font-body); font-size: 15px; font-weight: 700;
}
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.row2 { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .row2 { grid-template-columns: minmax(0, 1fr); } }

/* animal picker */
.animals { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.animal {
  appearance: none; border: 2px solid transparent; background: var(--sky);
  border-radius: 14px; padding: 6px 4px 4px; cursor: pointer;
  display: grid; justify-items: center; gap: 2px;
  font: inherit; font-size: 14px; color: var(--ink);
  transition: transform .15s, border-color .15s, background .15s;
}
.animal img { width: 58px; height: 58px; object-fit: contain; }
.animal:hover { transform: translateY(-2px); }
.animal[aria-pressed="true"] { border-color: var(--jump); background: #fff3e6; }
.animal:focus-visible, button:focus-visible, select:focus-visible, .staff-svg:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* key choice */
.keys { display: grid; gap: 10px; }
.key {
  appearance: none; font: inherit; cursor: pointer; text-align: left;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 14px; padding: 10px 14px; display: grid; gap: 0;
}
.key b { font-family: var(--font-display); font-size: 22px; }
.key span { font-size: 14px; color: var(--muted); }
.key[aria-pressed="true"] { border-color: var(--do); background: #f7ecf6; }

/* staff */
.staff-box { overflow-x: auto; }
.staff-svg { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: manipulation; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  appearance: none; font: inherit; font-size: 15px; cursor: pointer;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; min-height: 40px;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--jump); border-color: var(--jump); color: #fff; font-weight: 700; font-size: 18px; padding: 8px 22px; }
.btn.primary:hover { background: #d36712; border-color: #d36712; }
.count { margin-left: auto; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--do); }
.notes-pad { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.pad {
  appearance: none; font: inherit; cursor: pointer; border: 0; border-radius: 12px;
  padding: 6px 2px; display: grid; justify-items: center; line-height: 1.15;
  color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
}
.pad .sf { font-family: var(--font-solfa); font-style: italic; font-weight: 600; font-size: 22px; }
.pad .ln { font-size: 13px; color: var(--muted); }
.pad:active { transform: translateY(1px); box-shadow: none; }
.pad:disabled { opacity: .4; cursor: not-allowed; }
.msg:empty { display: none; }
.msg { margin: 0; font-size: 14px; color: var(--do); }

/* stage */
.stage-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.stage-head h2 { flex: 1 1 auto; }
.speed { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
.speed select { font: inherit; font-size: 15px; padding: 4px 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.stage-staff { display: block; box-sizing: border-box; width: 100%; height: auto; border: 2px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0; }
.stage-svg { display: block; width: 100%; height: auto; border-radius: 0 0 14px 14px; background: linear-gradient(#f3f9fd, #eaf5e4); }
.summary { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 15px; }
.chip { border-radius: 999px; padding: 2px 10px; background: #fff3e6; border: 1px solid var(--jump-soft); white-space: nowrap; }
.chip i { font-family: var(--font-solfa); font-weight: 600; }
.tally { color: var(--muted); }
/* quiz gate */
.step.gate { background: var(--do); font-family: var(--font-display); }
.quiz-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .quiz-body { grid-template-columns: minmax(0, 1fr); } }
.quiz-card { display: grid; justify-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px 14px; }
.qstaff { display: block; width: 100%; max-width: 440px; height: auto; cursor: crosshair; touch-action: none; }
.answer-line { font-family: var(--font-display); font-size: 30px; display: flex; align-items: baseline; gap: 10px; }
.blank { display: inline-block; min-width: 92px; text-align: center; border-bottom: 2px solid var(--ink); color: #d0342c; font-weight: 700; line-height: 1.2; }
.quiz-side { display: grid; gap: 12px; }
.choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.choice {
  appearance: none; font: inherit; cursor: pointer;
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 14px; padding: 8px 4px; min-height: 52px;
}
.choice:hover:not(:disabled) { border-color: var(--do); background: #f7ecf6; }
.choice:disabled { cursor: not-allowed; }
.choice.wrong { background: #fde4e2; border-color: #e07a72; color: #9b2c24; text-decoration: line-through; }
.choice.right { background: #e1f3d6; border-color: var(--grass); color: #2f6b1a; }
.status-row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 15px; }
.lives { display: inline-flex; align-items: center; gap: 6px; }
.life { width: 16px; height: 16px; border-radius: 50%; background: var(--jump); }
.life.used { background: transparent; border: 2px solid var(--jump-soft); }
.progress { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.star { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--grass); }
.star.on { background: var(--grass); }
.qhint { margin: 0; padding: 10px 12px; border-radius: 12px; background: #fff6e8; border: 1px solid var(--jump-soft); font-size: 16px; }
.qhint.good { background: #ecf7e4; border-color: #b6dca0; }
.qhint:empty { display: none; }
.passed { margin: 0; padding: 12px 14px; border-radius: 14px; background: #ecf7e4; border: 2px solid var(--grass); font-size: 17px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.passed b { font-family: var(--font-display); font-size: 22px; color: #2f6b1a; }
.stage-wrap { position: relative; }
.lock {
  position: absolute; inset: 0; border-radius: 14px;
  background: rgba(35, 49, 59, 0.55); color: #fff;
  display: grid; place-items: center; text-align: center; padding: 16px;
  font-family: var(--font-display); font-size: clamp(18px, 3vw, 26px);
}
@media (max-width: 520px) {
  .notes-pad { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .count { margin-left: 0; width: 100%; }
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>動物音程跳跳樂</h1>
    <p class="sub">選一隻動物，選大調，在五線譜寫最多八個全音符，看牠按音程跳起來！</p>
  </header>

  <div class="row2">
    <section class="panel" aria-labelledby="h-animal">
      <h2 id="h-animal"><span class="step">1</span>選一隻喜愛的動物</h2>
      <div class="animals" id="animals"></div>
    </section>
    <section class="panel" aria-labelledby="h-key">
      <h2 id="h-key"><span class="step">2</span>選大調</h2>
      <div class="keys">
        <button class="key" id="key-C" type="button" aria-pressed="true"><b>C大調</b><span>由 C 至高音 C，全是白鍵</span></button>
        <button class="key" id="key-F" type="button" aria-pressed="false"><b>F大調</b><span>由 F 至高音 F，有降 B（B♭）</span></button>
      </div>
    </section>
  </div>

  <section class="panel" aria-labelledby="h-staff">
    <h2 id="h-staff"><span class="step">3</span>在五線譜創作旋律</h2>
    <p class="hint">在五線譜上點一下就會加上全音符；點已有的音符可以改高低。也可以用下面的唱名鍵。紫色 <b style="color:var(--do)">d</b> 是 do 的位置。</p>
    <div class="staff-box">
      <svg class="staff-svg" id="staff" viewBox="0 56 900 222" role="img" aria-label="五線譜" tabindex="0"></svg>
    </div>
    <div class="notes-pad" id="pad"></div>
    <div class="toolbar">
      <button class="btn" id="listen" type="button">♪ 聽我的旋律</button>
      <button class="btn" id="undo" type="button">刪除最後一個</button>
      <button class="btn" id="clear" type="button">全部清除</button>
      <span class="count" id="count"></span>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <section class="panel" id="quiz" aria-labelledby="h-quiz">
    <h2 id="h-quiz"><span class="step gate">關</span>通關挑戰：數一數音程</h2>
    <p class="hint">看看紫色 <b style="color:var(--do)">d</b> 在哪裏，數一數兩個音相距多少度。答對 <b id="need">3</b> 題就可以看動物跳！每題只有三次機會。把游標或手指放在五線譜上，會出現灰色音符，幫你一線一間地數。</p>
    <div class="quiz-body">
      <div class="quiz-card">
        <svg class="qstaff" id="qstaff" viewBox="0 64 440 178" role="img" aria-label="音程題目"></svg>
        <div class="answer-line"><span class="blank" id="qblank">&nbsp;</span><span>度</span></div>
        <button class="btn" id="qlisten" type="button">♪ 聽一聽</button>
      </div>
      <div class="quiz-side">
        <div class="choices" id="choices"></div>
        <div class="status-row">
          <span class="lives" id="lives" aria-label="剩餘機會"></span>
          <span class="progress" id="qprogress"></span>
        </div>
        <p class="qhint" id="qhint" aria-live="polite"></p>
        <div><button class="btn" id="qnext" type="button" hidden>下一題 →</button></div>
      </div>
    </div>
    <div class="passed" id="passed" hidden><b>通關成功！</b><span>你懂得計算音程了，去看動物跳吧！</span><button class="btn primary" id="go-stage" type="button">去看動物跳 ↓</button></div>
  </section>

  <section class="panel" id="stage-panel" aria-labelledby="h-stage">
    <div class="stage-head">
      <h2 id="h-stage"><span class="step">4</span>看動物跳一跳</h2>
      <label class="speed">速度
        <select id="speed">
          <option value="1150">慢</option>
          <option value="850" selected>中</option>
          <option value="600">快</option>
        </select>
      </label>
      <button class="btn primary" id="play" type="button">▶ 跳吧！</button>
    </div>
    <div class="stage-wrap">
      <svg class="stage-staff" id="stage-staff" viewBox="0 56 900 222" role="img" aria-label="你創作的旋律"></svg>
      <svg class="stage-svg" id="stage" viewBox="0 0 900 330" role="img" aria-label="動物在青草線上按音程跳動"></svg>
      <div class="lock" id="lock">先完成上面的通關挑戰，<br>才可以看動物跳！</div>
    </div>
    <div class="summary" id="summary"></div>
  </section>
</div>

    o1.start(t); o2.start(t); o1.stop(t + 1.2); o2.stop(t + 0.3);
  } catch (e) {}
}

/* ---------- step 1: animals ---------- */
const animalsBox = document.getElementById("animals");
ANIMALS.forEach(a => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "animal"; b.dataset.id = a.id;
  b.innerHTML = `<img src="${a.src}" alt=""><span>${a.name}</span>`;
  b.addEventListener("click", () => { if (state.playing) return; state.animal = a.id; save(); renderAnimals(); renderStage(); });
  animalsBox.appendChild(b);
});
function renderAnimals() {
  animalsBox.querySelectorAll(".animal").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === state.animal)));
}

/* ---------- step 2: key ---------- */
["C", "F"].forEach(k => {

    if (state.playing) return;
    state.key = k; save(); renderAll();
  });
});

/* ---------- step 3: staff ---------- */
const staff = document.getElementById("staff");
const SP = 24;               // space between staff lines
const BOTTOM = 190;          // y of bottom line (E4)
const stepY = s => BOTTOM - s * SP / 2;
const SLOT_X0 = 238;
let listenIdx = -1, listenTimer = null;
let SLOT_DX = 84, VW = 900;   // narrower score on phones
function layout() {
  const narrow = document.querySelector(".wrap").clientWidth < 600;
  SLOT_DX = narrow ? 52 : 84;
  VW = narrow ? 650 : 900;
  document.getElementById("staff").setAttribute("viewBox", `0 56 ${VW} 222`);
  document.getElementById("stage-staff").setAttribute("viewBox", `0 56 ${VW} 222`);
  document.getElementById("stage").setAttribute("viewBox", `0 0 ${VW} 330`);
  return narrow;
}
let lastNarrow = layout();
window.addEventListener("resize", () => {
  const was = lastNarrow; lastNarrow = layout();
  if (was !== lastNarrow && !state.playing) renderAll();
});
const slotX = i => SLOT_X0 + i * SLOT_DX;
let hover = null;            // {slot, deg}

function stepOf(deg) { return KEYS[state.key].baseStep + deg; }

function drawNoteHead(g, x, y, color, opacity = 1) {
  const n = el("g", { transform: `translate(${x} ${y})`, opacity }, g);
  el("ellipse", { rx: 14, ry: 10, fill: color }, n);
  el("ellipse", { rx: 6.5, ry: 4.6, fill: "#ffffff", transform: "rotate(-35)" }, n);
  return n;
}
function ledgerFor(g, x, step, color) {
  // ledger lines below (step <= -2) or above (step >= 10)
  for (let s = -2; s >= step; s -= 2) el("line", { x1: x - 22, x2: x + 22, y1: stepY(s), y2: stepY(s), stroke: color, "stroke-width": 2 }, g);
  for (let s = 10; s <= step; s += 2) el("line", { x1: x - 22, x2: x + 22, y1: stepY(s), y2: stepY(s), stroke: color, "stroke-width": 2 }, g);
}
function solfaText(parent, x, y, deg, size, fill) {
  const t = el("text", { x, y, "text-anchor": "middle", "font-family": "Lora, Georgia, serif", "font-style": "italic", "font-weight": 600, "font-size": size, fill }, parent);
  t.textContent = SOLFA[deg];
  if (deg === 7) { const tick = el("tspan", { dx: 1, dy: -size * 0.45, "font-size": size * 0.7, "font-style": "normal" }, t); tick.textContent = "ˈ"; }
  return t;
}

function drawScore(svg, xOf, activeIdx, opts = {}) {
  svg.innerHTML = "";
  const ink = "#23313b";
  el("rect", { x: 0, y: 56, width: VW, height: 222, fill: "#ffffff" }, svg);
  for (let i = 0; i < 5; i++) el("line", { x1: 12, x2: VW - 16, y1: stepY(i * 2), y2: stepY(i * 2), stroke: ink, "stroke-width": 1.6 }, svg);
  el("line", { x1: VW - 24, x2: VW - 24, y1: stepY(8), y2: stepY(0), stroke: ink, "stroke-width": 1.6 }, svg);
  el("rect", { x: VW - 20, y: stepY(8), width: 5, height: SP * 4, fill: ink }, svg);
  el("line", { x1: 12, x2: 12, y1: stepY(8), y2: stepY(0), stroke: ink, "stroke-width": 1.6 }, svg);
  // treble clef: glyph units, G-line at 160, one staff space = 155 units
  const k = SP / 155;
  el("path", { d: CLEF_PATH, fill: ink, transform: `translate(4 ${stepY(2)}) scale(${k} ${-k}) translate(0 -160)` }, svg);
  let doX = 150;
  if (state.key === "F") {
    const kf = SP / 360;
    el("path", { d: FLAT_PATH, fill: ink, transform: `translate(98 ${stepY(4)}) scale(${kf} ${-kf}) translate(0 -205)` }, svg);
    doX = 162;
  }
  // purple "d" box marks where do is
  const dy = stepY(stepOf(0));
  if (stepOf(0) <= -2) el("line", { x1: doX - 17, x2: doX + 17, y1: stepY(-2), y2: stepY(-2), stroke: ink, "stroke-width": 2 }, svg);
  el("rect", { x: doX - 12, y: dy - 12, width: 24, height: 24, rx: 4, fill: "#8a2f86" }, svg);
  const dt = el("text", { x: doX, y: dy + 6.5, "text-anchor": "middle", "font-family": "Lora, Georgia, serif", "font-style": "italic", "font-weight": 600, "font-size": 20, fill: "#ffffff" }, svg);
  dt.textContent = "d";

  if (opts.slots) for (let i = state.notes.length; i < MAX; i++) el("circle", { cx: xOf(i), cy: 250, r: 3, fill: "#cfdde6" }, svg);
  state.notes.forEach((deg, i) => {
    const s = stepOf(deg), x = xOf(i);
    let color = ink;
    if (i === activeIdx) {
      color = "#e8781e";
      el("circle", { cx: x, cy: stepY(s), r: 24, fill: "#e8781e", opacity: 0.18 }, svg);
    } else if (opts.trailDone && activeIdx >= 0 && i < activeIdx) color = "#e8a36b";
    ledgerFor(svg, x, s, color);
    drawNoteHead(svg, x, stepY(s), color);
    solfaText(svg, x, 258, deg, 22, i === activeIdx ? "#e8781e" : "#8a2f86");
  });
}

function renderStaff(activeIdx = listenIdx) {
  drawScore(staff, slotX, activeIdx, { slots: true });
  drawScore(stageStaff, landX, activeIdx, { trailDone: true });
  // hover ghost
  if (hover && !state.playing) {
    const s = stepOf(hover.deg), x = slotX(hover.slot);
    const gg = el("g", { opacity: 0.35 }, staff);
    ledgerFor(gg, x, s, "#1f6fb2");
    drawNoteHead(gg, x, stepY(s), "#1f6fb2");
  }
  // click catcher
  el("rect", { x: 200, y: 56, width: VW - 224, height: 222, fill: "transparent", id: "hit" }, staff);
}

function svgPoint(svg, evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function hitFromEvent(evt) {
  const p = svgPoint(staff, evt);
  if (p.x < 200 || p.x > VW - 24) return null;
  let slot = Math.round((p.x - SLOT_X0) / SLOT_DX);
  slot = Math.max(0, Math.min(MAX - 1, slot));
  if (slot > state.notes.length) slot = state.notes.length;   // no gaps: next empty slot
  if (slot >= MAX) return null;
  const step = Math.round((BOTTOM - p.y) / (SP / 2));
  const deg = Math.max(0, Math.min(7, step - KEYS[state.key].baseStep));
  return { slot, deg };
}
staff.addEventListener("pointermove", e => {
  if (state.playing) return;
  const h = hitFromEvent(e);
  if (JSON.stringify(h) !== JSON.stringify(hover)) { hover = h; renderStaff(); }
});
staff.addEventListener("pointerleave", () => { hover = null; renderStaff(); });
staff.addEventListener("click", e => {
  if (state.playing) return;
  const h = hitFromEvent(e);
  if (!h) return;
  setNote(h.slot, h.deg);
});
function setNote(slot, deg) {
  if (slot >= MAX) { flash("最多只可以寫八個音符。"); return; }
  stopListen();
  if (slot < state.notes.length) state.notes[slot] = deg; else state.notes.push(deg);
  tone(KEYS[state.key].freqs[deg]);
  flash("");
  save(); renderAll();
}

/* pad buttons */
const pad = document.getElementById("pad");
function renderPad() {
  pad.innerHTML = "";
  const full = state.notes.length >= MAX;

    b.type = "button"; b.className = "pad"; b.style.background = PAD_COLORS[deg];
    b.disabled = full || state.playing;
    b.innerHTML = `<span class="sf">${SOLFA[deg]}${deg === 7 ? "ˈ" : ""}</span><span class="ln">${L}</span>`;
    b.setAttribute("aria-label", `加上 ${SOLFA[deg]}${deg === 7 ? "（高音）" : ""}，音名 ${L}`);
    b.addEventListener("click", () => setNote(state.notes.length, deg));
    pad.appendChild(b);
  });
}

document.getElementById("undo").addEventListener("click", () => { if (state.playing) return; stopListen(); state.notes.pop(); save(); renderAll(); });
document.getElementById("clear").addEventListener("click", () => { if (state.playing) return; stopListen(); state.notes = []; save(); renderAll(); });


/* listen to the whole melody */
const listenBtn = document.getElementById("listen");
function stopListen() {
  if (listenTimer === null && listenIdx === -1) return;
  clearTimeout(listenTimer); listenTimer = null; listenIdx = -1;
  listenBtn.textContent = "♪ 聽我的旋律";
  renderStaff();
}
listenBtn.addEventListener("click", () => {
  if (listenTimer !== null) { stopListen(); return; }
  if (!state.notes.length || state.playing) return;
  listenBtn.textContent = "■ 停止";
  let i = 0;
  const step = () => {
    if (i >= state.notes.length) { listenTimer = setTimeout(stopListen, 500); return; }
    tone(KEYS[state.key].freqs[state.notes[i]]);
    listenIdx = i; renderStaff();
    i++;
    listenTimer = setTimeout(step, 650);
  };
  step();
});

const msg = document.getElementById("msg");
function flash(t) { msg.textContent = t; }

function renderCount() {
  document.getElementById("count").innerHTML = `音符 <b>${state.notes.length}</b> / ${MAX}`;
  document.getElementById("listen").disabled = !state.notes.length || state.playing;
  document.getElementById("undo").disabled = !state.notes.length || state.playing;
  document.getElementById("clear").disabled = !state.notes.length || state.playing;
  document.getElementById("play").disabled = (state.notes.length < 2 || !quiz.passed[state.key]) && !state.playing;
  if (state.notes.length >= MAX) flash("已寫滿八個音符！按「跳吧！」看看動物怎樣跳。");
}

/* ---------- step 4: stage ---------- */
const stage = document.getElementById("stage");
const stageStaff = document.getElementById("stage-staff");
const GROUND = 282;
const LX0 = SLOT_X0;                  // same x as the notes on the score
const landX = i => LX0 + i * SLOT_DX;
const jumpH = deg => deg === 0 ? 16 : 14 + deg * 26;   // 1 = 2nd ... 7 = octave
let animalNode = null, trailLayer = null, labelLayer = null;

function animalInfo() { return ANIMALS.find(a => a.id === state.animal) || ANIMALS[0]; }
function animalSize() {
  const a = animalInfo(), H = 84;
  let w = a.w / a.h * H, h = H;
  if (w > 104) { w = 104; h = a.h / a.w * w; }
  return { w, h };
}
function arcPath(i, t1 = 1) {
  const x0 = landX(i), x1 = landX(i + 1);
  const deg = Math.abs(state.notes[i + 1] - state.notes[i]);
  const h = jumpH(deg);
  const pts = [];
  const N = 30;
  for (let k = 0; k <= N * t1; k++) {
    const t = k / N;
    pts.push(`${(x0 + (x1 - x0) * t).toFixed(1)},${(GROUND - 8 - h * 4 * t * (1 - t)).toFixed(1)}`);
  }
  return "M" + pts.join(" L");
}

function renderStage() {
  stage.innerHTML = "";
  // distant hills + flowers
  el("path", { d: `M0 230 Q120 190 240 222 T480 214 T720 220 T960 206 L${VW} 330 L0 330 Z`, fill: "#e4f2da" }, stage);
  // grass ground
  el("rect", { x: 0, y: GROUND, width: VW, height: 48, fill: "#dcefcf" }, stage);
  // the green grass line with tufts
  let tufts = "";
  for (let x = 6; x < VW; x += 14) tufts += `M${x} ${GROUND} l4 -10 l3 10 l4 -7 l3 7 `;
  el("path", { d: tufts, fill: "none", stroke: "#4f9a33", "stroke-width": 2, "stroke-linejoin": "round" }, stage);
  el("line", { x1: 0, x2: VW, y1: GROUND, y2: GROUND, stroke: "#4f9a33", "stroke-width": 5, "stroke-linecap": "round" }, stage);

  // landing marks + labels
  state.notes.forEach((deg, i) => {
    el("ellipse", { cx: landX(i), cy: GROUND + 1, rx: 16, ry: 5, fill: "#4f9a33", opacity: 0.35 }, stage);
    if (state.showSolfa) solfaText(stage, landX(i), GROUND + 32, deg, 22, "#8a2f86");
    else { const t = el("text", { x: landX(i), y: GROUND + 30, "text-anchor": "middle", "font-size": 16, fill: "#5d6d78" }, stage); t.textContent = i + 1; }
  });
  // preview arcs (dashed)
  const preview = el("g", {}, stage);
  for (let i = 0; i < state.notes.length - 1; i++) {
    el("path", { d: arcPath(i), fill: "none", stroke: "#f7c99f", "stroke-width": 3, "stroke-dasharray": "2 8", "stroke-linecap": "round" }, preview);
  }
  trailLayer = el("g", {}, stage);
  labelLayer = el("g", {}, stage);

  if (!state.notes.length) {
    const t = el("text", { x: VW / 2, y: 150, "text-anchor": "middle", "font-size": 20, fill: "#5d6d78" }, stage);
    t.textContent = "先在五線譜寫最少兩個音符";
  }
  // animal
  const a = animalInfo(), sz = animalSize();
  animalNode = el("g", {}, stage);
  el("image", { href: a.src, width: sz.w, height: sz.h, x: -sz.w / 2, y: -sz.h, preserveAspectRatio: "xMidYMid meet" }, animalNode);
  placeAnimal(landX(0), GROUND - 2, 0, 1);
  renderSummary();
}
function placeAnimal(x, y, rot = 0, sy = 1) {
  animalNode.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${(2 - sy).toFixed(3)} ${sy.toFixed(3)})`);
}
function addLabel(i) {
  const d1 = state.notes[i], d2 = state.notes[i + 1];
  const deg = Math.abs(d2 - d1);
  const x = (landX(i) + landX(i + 1)) / 2;
  const narrow = VW < 900;
  const y = GROUND - 8 - jumpH(deg) - 12 - (narrow && i % 2 ? 30 : 0);
  const g = el("g", {}, labelLayer);
  const txt = DEG_NAME[deg] + (d2 > d1 ? " ↑" : d2 < d1 ? " ↓" : "");
  const fs = narrow ? 14 : 17;
  const w = txt.length * fs * 0.88 + 12;
  el("rect", { x: x - w / 2, y: y - fs - 5, width: w, height: fs + 11, rx: (fs + 11) / 2, fill: "#ffffff", stroke: "#e8781e", "stroke-width": 2 }, g);
  const t = el("text", { x, y: y - 2, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: "#b45309", "font-family": "LXGW WenKai TC, PingFang TC, Microsoft JhengHei, sans-serif" }, g);
  t.textContent = txt;
}

function renderSummary() {
  const box = document.getElementById("summary");
  box.innerHTML = "";
  if (state.notes.length < 2) return;
  const tally = {};
  const lab = document.createElement("span"); lab.textContent = "旋律用了："; box.appendChild(lab);
  for (let i = 0; i < state.notes.length - 1; i++) {
    const a = state.notes[i], b = state.notes[i + 1], deg = Math.abs(b - a);
    tally[deg] = (tally[deg] || 0) + 1;
    const c = document.createElement("span"); c.className = "chip";
    c.innerHTML = `<i>${SOLFA[a]}${a === 7 ? "ˈ" : ""}</i> → <i>${SOLFA[b]}${b === 7 ? "ˈ" : ""}</i> ${DEG_NAME[deg]}`;
    box.appendChild(c);
  }
  const t = document.createElement("span"); t.className = "tally";
  t.textContent = "　共 " + Object.keys(tally).sort((x, y) => x - y).map(d => `${DEG_NAME[d]} ×${tally[d]}`).join("、");
  box.appendChild(t);
}

/* ---------- play ---------- */
const playBtn = document.getElementById("play");
let raf = 0;
playBtn.addEventListener("click", () => {
  if (state.playing) { stop(); return; }
  if (state.notes.length < 2 || !quiz.passed[state.key]) return;
  start();
});
function setPlaying(p) {
  state.playing = p;
  playBtn.textContent = p ? "■ 停止" : "▶ 跳吧！";
  playBtn.disabled = false;
  renderPad(); renderCount();
}
function stop() {
  cancelAnimationFrame(raf);
  setPlaying(false);
  renderStaff();
}
function start() {
  stopListen();
  hover = null;
  renderStage();
  setPlaying(true);
  const dur = +document.getElementById("speed").value;
  const freqs = KEYS[state.key].freqs;
  tone(freqs[state.notes[0]]);
  renderStaff(0);
  let i = 0, t0 = performance.now() + 350;
  let trail = null;
  function frame(now) {
    if (!state.playing) return;
    if (now < t0) { raf = requestAnimationFrame(frame); return; }
    const t = Math.min(1, (now - t0) / dur);
    const deg = Math.abs(state.notes[i + 1] - state.notes[i]);
    const h = jumpH(deg);
    if (!trail) {
      trail = el("path", { fill: "none", stroke: "#e8781e", "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round" }, trailLayer);
    }
    // ease the horizontal move a little, keep the arc a parabola
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const x = landX(i) + (landX(i + 1) - landX(i)) * e;
    const y = GROUND - 2 - h * 4 * e * (1 - e);
    const rot = (0.5 - e) * -18 * Math.min(1, h / 60);
    const squash = t < 0.08 ? 1 - (0.08 - t) * 2 : 1;
    placeAnimal(x, y, rot, squash);
    trail.setAttribute("d", arcPath(i, e));
    if (t >= 1) {
      tone(freqs[state.notes[i + 1]]);
      addLabel(i);
      i++;
      renderStaff(i);
      placeAnimal(landX(i), GROUND - 2, 0, 0.82);
      trail = null;
      if (i >= state.notes.length - 1) {
        setTimeout(() => { if (state.playing) { placeAnimal(landX(i), GROUND - 2, 0, 1); stop(); } }, 500);
        return;
      }
      t0 = now + 160;
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

/* ---------- gate: interval quiz ---------- */
const NEED = 3;                         // 答對多少題才通關
const NUM_CN = ["一", "二", "三", "四", "五", "六", "七", "八"];
const quiz = { key: null, q: null, last: null, tries: 3, correct: 0, done: false, passed: { C: false, F: false } };
document.getElementById("need").textContent = NEED;
const qstaff = document.getElementById("qstaff");
const QX1 = 236, QX2 = 380;             // x of first and second note

function newQuestion() {
  let q;
  do {
    q = { other: 1 + Math.floor(Math.random() * 7), doFirst: Math.random() < 0.5 };
  } while (quiz.last && q.other === quiz.last.other);
  quiz.q = q; quiz.last = q; quiz.tries = 3; quiz.done = false; quiz.key = state.key;
  quiz.wrong = [];
  document.getElementById("qhint").textContent = "";
  document.getElementById("qhint").className = "qhint";
  document.getElementById("qnext").hidden = true;
  renderQuiz();
}
function qNotes() {        // [deg of first note, deg of second note]
  return quiz.q.doFirst ? [0, quiz.q.other] : [quiz.q.other, 0];
}
function drawQuizStaff(showCount) {
  const svg = qstaff, ink = "#23313b";
  svg.innerHTML = "";
  el("rect", { x: 0, y: 64, width: 440, height: 178, fill: "#ffffff" }, svg);
  for (let i = 0; i < 5; i++) el("line", { x1: 8, x2: 426, y1: stepY(i * 2), y2: stepY(i * 2), stroke: ink, "stroke-width": 1.6 }, svg);
  el("line", { x1: 418, x2: 418, y1: stepY(8), y2: stepY(0), stroke: ink, "stroke-width": 1.6 }, svg);
  el("rect", { x: 422, y: stepY(8), width: 5, height: SP * 4, fill: ink }, svg);
  const k = SP / 155;
  el("path", { d: CLEF_PATH, fill: ink, transform: `translate(2 ${stepY(2)}) scale(${k} ${-k}) translate(0 -160)` }, svg);
  let doX = 150;
  if (state.key === "F") {
    const kf = SP / 360;
    el("path", { d: FLAT_PATH, fill: ink, transform: `translate(96 ${stepY(4)}) scale(${kf} ${-kf}) translate(0 -205)` }, svg);
    doX = 162;
  }
  const base = KEYS[state.key].baseStep;
  const dy = stepY(base);
  if (base <= -2) el("line", { x1: doX - 17, x2: doX + 17, y1: stepY(-2), y2: stepY(-2), stroke: ink, "stroke-width": 2 }, svg);
  el("rect", { x: doX - 12, y: dy - 12, width: 24, height: 24, rx: 4, fill: "#8a2f86" }, svg);
  const dt = el("text", { x: doX, y: dy + 6.5, "text-anchor": "middle", "font-family": "Lora, Georgia, serif", "font-style": "italic", "font-weight": 600, "font-size": 20, fill: "#ffffff" }, svg);
  dt.textContent = "d";
  const [a, b] = qNotes();
  [[a, QX1], [b, QX2]].forEach(([deg, x]) => {
    const s = base + deg;
    ledgerFor(svg, x, s, ink);
    drawNoteHead(svg, x, stepY(s), ink);
  });
  if (showCount) {
    // count every line and space from the lower note to the higher note
    const lowX = a <= b ? QX1 : QX2, highX = a <= b ? QX2 : QX1;
    const lo = base + Math.min(a, b), hi = base + Math.max(a, b), n = hi - lo + 1;
    for (let i = 0; i < n; i++) {
      const dir = highX > lowX ? 1 : -1, x0 = lowX + dir * 26, x1 = highX - dir * 26;
      const x = x0 + (x1 - x0) * (n === 1 ? 0 : i / (n - 1));
      const y = stepY(lo + i);
      el("circle", { cx: x, cy: y, r: 7.5, fill: "#e8781e" }, svg);
      const t = el("text", { x, y: y + 4, "text-anchor": "middle", "font-size": 11.5, "font-weight": 700, fill: "#ffffff" }, svg);
      t.textContent = i + 1;
    }
  }
  // dark grey helper note that follows the pointer / finger
  if (qHover) {
    const g = el("g", { opacity: 0.75, "pointer-events": "none" }, svg);
    ledgerFor(g, qHover.x, qHover.step, "#5d6770");
    drawNoteHead(g, qHover.x, stepY(qHover.step), "#5d6770");
  }
}
let qHover = null;
function qHoverFrom(e) {
  const p = svgPoint(qstaff, e);
  const x = Math.max(205, Math.min(400, p.x));
  const step = Math.max(-3, Math.min(10, Math.round((BOTTOM - p.y) / (SP / 2))));
  return { x, step };
}
function redrawQuizStaff() { drawQuizStaff(quiz.done && quiz.tries === 0); }
function renderQuiz() {
  if (!quiz.q || quiz.key !== state.key) { newQuestion(); return; }
  const answer = quiz.q.other + 1;
  drawQuizStaff(quiz.done && quiz.tries === 0);
  document.getElementById("qblank").innerHTML = quiz.done ? NUM_CN[answer - 1] : "&nbsp;";
  // choices 二..八
  const box = document.getElementById("choices");
  box.innerHTML = "";
  for (let n = 2; n <= 8; n++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice"; b.textContent = NUM_CN[n - 1] + "度";
    if (quiz.wrong.includes(n)) b.classList.add("wrong");
    if (quiz.done && n === answer) b.classList.add("right");
    b.disabled = quiz.done || quiz.wrong.includes(n);
    b.addEventListener("click", () => answerQuiz(n));
    box.appendChild(b);
  }
  const lives = document.getElementById("lives");
  lives.innerHTML = "機會 " + [0, 1, 2].map(i => `<span class="life${i < quiz.tries ? "" : " used"}"></span>`).join("");
  const passedNow = quiz.passed[state.key];
  document.getElementById("qprogress").innerHTML = "答對 " +
    Array.from({ length: NEED }, (_, i) => `<span class="star${i < Math.min(quiz.correct, NEED) ? " on" : ""}"></span>`).join("") +
    ` <b>${Math.min(quiz.correct, NEED)}</b> / ${NEED}`;
  document.getElementById("passed").hidden = !passedNow;
  document.getElementById("lock").hidden = passedNow;
}
function lineOrSpace(step) { return (step % 2 === 0) ? "線" : "間"; }
function answerQuiz(n) {
  if (quiz.done) return;
  const answer = quiz.q.other + 1;
  const hint = document.getElementById("qhint");
  const [a, b] = qNotes();
  const base = KEYS[state.key].baseStep;
  if (n === answer) {
    quiz.done = true; quiz.correct++;
    hint.className = "qhint good";
    hint.innerHTML = `答對了！<i>${SOLFA[a]}${a === 7 ? "ˈ" : ""}</i> 和 <i>${SOLFA[b]}${b === 7 ? "ˈ" : ""}</i> 相距 <b>${NUM_CN[answer - 1]}度</b>。`;
    playPair();
    if (quiz.correct >= NEED && !quiz.passed[state.key]) {
      quiz.passed[state.key] = true;
      hint.innerHTML += " 你已經通關了！";
    }
    document.getElementById("qnext").textContent = "下一題 →";
    document.getElementById("qnext").hidden = false;
  } else {
    quiz.tries--;
    quiz.wrong.push(n);
    hint.className = "qhint";
    if (quiz.tries === 2) {
      hint.innerHTML = Math.abs(n - answer) === 1
        ? "差一點！記得由低的音開始數，<b>兩個音本身都要數在內</b>。"
        : "小提示：由較低的音數起，一線、一間地數上去，數到另一個音為止，兩個音都要數。";
    } else if (quiz.tries === 1) {
      const s1 = base + a, s2 = base + b;
      const p1 = lineOrSpace(s1), p2 = lineOrSpace(s2);
      const odd = (s1 % 2 === 0) === (s2 % 2 === 0);
      hint.innerHTML = `再想一想：第一個音在<b>${p1}</b>上，第二個音在<b>${p2}</b>上，「${p1}到${p2}」是<b>${odd ? "單數度（三、五、七度）" : "雙數度（二、四、六、八度）"}</b>。`;
    } else {
      quiz.done = true;
      hint.innerHTML = `三次機會用完了。答案是 <b>${NUM_CN[answer - 1]}度</b>，看看五線譜上的橙色數字是怎樣數的。再試一條新題目吧！`;
      document.getElementById("qnext").textContent = "換一條新題目 →";
      document.getElementById("qnext").hidden = false;
    }
  }
  renderQuiz();
  renderCount();
}
function playPair() {
  const f = KEYS[state.key].freqs, [a, b] = qNotes();
  tone(f[a]); tone(f[b], 0.6);
}
document.getElementById("qlisten").addEventListener("click", playPair);
["pointerdown", "pointermove"].forEach(ev => qstaff.addEventListener(ev, e => {
  const h = qHoverFrom(e);
  if (!qHover || h.step !== qHover.step || Math.abs(h.x - qHover.x) > 1) { qHover = h; redrawQuizStaff(); }
}));
qstaff.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { qHover = null; redrawQuizStaff(); } });
document.getElementById("qnext").addEventListener("click", newQuestion);
document.getElementById("go-stage").addEventListener("click", () => {
  document.getElementById("stage-panel").scrollIntoView({ behavior: "smooth", block: "start" });
});

/* ---------- render all ---------- */
function renderAll() {
  ["C", "F"].forEach(k => document.getElementById("key-" + k).setAttribute("aria-pressed", String(state.key === k)));
  if (state.notes.length < MAX) flash(msg.textContent.startsWith("已寫滿") ? "" : msg.textContent);
  renderAnimals(); renderStaff(); renderPad(); renderQuiz(); renderCount(); renderStage();
}
renderAll();
</script>
