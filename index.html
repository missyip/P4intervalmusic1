<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>音程小老師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Lora:ital,wght@1,600&display=swap">
<style>
/* Layout: phase strip on top, one big question card, controls under it, class tally at the bottom. Single light classroom theme by choice (matches 動物音程跳跳樂 and 音程閃卡). */
:root {
  --sky: #fdf5d6;        /* light yellow page */
  --paper: #ffffff;
  --ink: #23313b;
  --muted: #5d6d78;
  --line: #cfdde6;
  --grass: #4f9a33;
  --do: #8a2f86;
  --jump: #e8781e;
  --jump-soft: #f7c99f;
  --wrong: #d0342c;
  --amber: #e0a21a;
  --focus: #1f6fb2;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "DFKai-SB", "PingFang TC", "Microsoft JhengHei", serif;
  --font-body: "PingFang TC", "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", system-ui, sans-serif;
  color-scheme: light;
}
html { background: var(--sky); }
body {
  background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 42px); font-weight: 700; margin: 0; letter-spacing: .04em; }
.phases { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 20px; }
.phase { padding: 4px 14px; border-radius: 999px; background: var(--paper); border: 2px solid var(--line); color: var(--muted); }
.phase.on { background: var(--do); border-color: var(--do); color: #fff; font-weight: 700; }
.arrow { color: var(--muted); }
.toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 17px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--do); }

.card {
  background: var(--paper); border-radius: 24px; padding: 14px 20px 18px;
  display: grid; justify-items: center; gap: 6px; position: relative;
  box-shadow: 0 2px 0 var(--line), 0 18px 40px -28px rgba(35, 49, 59, .5);
}
.card-title { position: absolute; top: 12px; left: 20px; font-family: var(--font-display); font-size: 20px; color: var(--muted); }
.card-key { position: absolute; top: 12px; right: 20px; font-family: var(--font-display); font-size: 20px; color: var(--do); font-weight: 700; }
.staff { display: block; width: 100%; max-width: min(820px, max(400px, calc((100vh - 430px) * 1.97))); height: auto; cursor: crosshair; touch-action: none; margin-top: 22px; }
.answer-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 28px; }
.answer-line { font-family: var(--font-display); font-size: clamp(40px, 7vw, 60px); display: flex; align-items: baseline; gap: 14px; line-height: 1.1; }
.blank { display: inline-block; min-width: 1.9em; text-align: center; border-bottom: 3px solid var(--ink); color: var(--wrong); font-weight: 700; }
.blank.pop { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
.tip { margin: 0; color: var(--muted); font-size: 15px; text-align: center; }

.panel { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.label { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.seg { display: inline-flex; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button {
  appearance: none; border: 0; background: transparent; font: inherit; font-family: var(--font-display);
  font-size: 20px; font-weight: 700; color: var(--ink); padding: 6px 18px; border-radius: 999px; cursor: pointer; min-height: 44px;
}
.seg button[aria-pressed="true"] { background: var(--do); color: #fff; }
.btn {
  appearance: none; font: inherit; font-size: 17px; cursor: pointer; border: 2px solid var(--line); background: var(--paper);
  color: var(--ink); border-radius: 999px; padding: 6px 18px; min-height: 46px;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.big {
  appearance: none; font: inherit; font-family: var(--font-display); font-size: 26px; font-weight: 700; cursor: pointer;
  background: var(--jump); color: #fff; border: 0; border-radius: 999px; padding: 10px 28px; min-height: 60px;
}
.big:hover { background: #d36712; }
.big.purple { background: var(--do); }
.big.purple:hover { background: #73246f; }
button:focus-visible, .toggle input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.pads { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.pad {
  appearance: none; font: inherit; cursor: pointer; border: 0; border-radius: 14px; padding: 8px 2px;
  display: grid; justify-items: center; line-height: 1.15; color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
}
.pad .sf { font-family: "Lora", Georgia, serif; font-style: italic; font-weight: 600; font-size: 26px; }
.pad .ln { font-size: 15px; color: var(--muted); font-weight: 700; }
.pad:disabled { opacity: .4; cursor: not-allowed; }

.choices { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.choice {
  appearance: none; font: inherit; cursor: pointer; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(24px, 3.4vw, 34px); border: 3px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 18px; padding: 8px 4px; min-height: 70px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.06);
}
.choice:hover:not(:disabled) { border-color: var(--do); background: #f7ecf6; }
.choice:disabled { cursor: not-allowed; }
.choice.wrong { background: #fde4e2; border-color: #e07a72; color: #9b2c24; text-decoration: line-through; }
.choice.right { background: #e1f3d6; border-color: var(--grass); color: #2f6b1a; }

.msg { margin: 0; font-size: clamp(18px, 2.3vw, 22px); line-height: 1.5; padding: 12px 16px; border-radius: 16px; background: #fff6e8; border: 2px solid var(--jump-soft); }
.msg.good { background: #ecf7e4; border-color: #b6dca0; }
.msg.plain { background: var(--paper); border-color: var(--line); }
.msg:empty { display: none; }
.msg i { font-family: "Lora", Georgia, serif; font-weight: 600; }

.coach { background: #fbf3fb; border: 3px solid var(--do); border-radius: 20px; padding: 14px 18px 16px; display: grid; gap: 10px; }
.coach h3 { margin: 0; font-family: var(--font-display); font-size: 26px; color: var(--do); }
.coach li i { font-family: "Lora", Georgia, serif; font-weight: 600; color: var(--do); font-size: 1.15em; }
.coach ol { margin: 0; padding-left: 1.6em; display: grid; gap: 8px; font-size: clamp(18px, 2.3vw, 22px); line-height: 1.45; }
.coach li::marker { font-weight: 700; color: var(--do); }
.say { background: var(--paper); border-radius: 10px; padding: 1px 8px; font-weight: 700; }

.stats { background: var(--paper); border-radius: 20px; padding: 14px 18px 16px; display: grid; gap: 12px; }
.stats h2 { margin: 0; font-family: var(--font-display); font-size: 24px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; display: grid; gap: 0; }
.kpi span { font-size: 15px; color: var(--muted); }
.kpi b { font-family: var(--font-display); font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi.main { border-color: var(--grass); background: #f1f9ec; }
.kpi.main b { color: #2f6b1a; }
.barwrap { display: grid; gap: 6px; }
.bar { display: flex; height: 22px; border-radius: 999px; overflow: hidden; background: #eef3f6; }
.bar div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
.c-first { background: var(--grass); }
.c-second { background: var(--amber); }
.c-miss { background: var(--wrong); }
.empty { margin: 0; color: var(--muted); font-size: 16px; }
.danger { border-color: #e07a72; color: #9b2c24; }

@media (max-width: 640px) {
  .pads { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .choices { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toggle { margin-left: 0; }
  .staff { margin-top: 32px; }
}
/* short landscape screens (iPad landscape, 1366×768): keep staff and answer buttons on one screen */
@media (max-height: 860px) and (min-width: 641px) {
  body { padding-block: 10px 16px; }
  .wrap { gap: 10px; }
  h1 { font-size: 30px; }
  .phases { font-size: 17px; }
  .card { padding: 8px 16px 10px; gap: 2px; }
  .card-title, .card-key { top: 8px; font-size: 17px; }
  .staff { margin-top: 6px; max-width: min(820px, max(380px, calc((100vh - 480px) * 1.97))); }
  .answer-line { font-size: 46px; }
  .tip { display: none; }
  .panel { gap: 8px; }
  .label { font-size: 19px; }
  .choice { min-height: 58px; padding: 4px; }
  .pad { padding: 4px 2px; }
  .pad .sf { font-size: 22px; }
  .btn { min-height: 40px; }
  .big { min-height: 52px; font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .blank.pop { animation: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>音程小老師</h1>
    <div class="phases" aria-label="步驟">
      <span class="phase on" id="ph-make">① 出題</span><span class="arrow">→</span><span class="phase" id="ph-ask">② 問同學</span>
    </div>
    <label class="toggle"><input type="checkbox" id="names" checked>顯示唱名</label>
  </header>

  <div class="row" id="new-row" hidden>
    <button class="btn danger" id="new-q" type="button">出新題目</button>
    <span class="empty" id="new-q-note"></span>
  </div>

  <section class="card" aria-live="polite">
    <span class="card-title" id="card-title">我的題目</span>
    <span class="card-key" id="card-key">C大調</span>
    <svg class="staff" id="staff" viewBox="0 30 460 234" role="img" aria-label="音程題目"></svg>
    <div class="answer-row">
      <div class="answer-line"><span class="blank" id="blank">&nbsp;</span><span>度</span></div>
      <button class="btn" id="listen" type="button">♪ 聽一聽</button>
    </div>
    <p class="tip" id="tip"></p>
  </section>

  <!-- ① make the question -->
  <section class="panel" id="make">
    <div class="row">
      <span class="label">選大調</span>
      <div class="seg" role="group" aria-label="選大調">
        <button type="button" id="k-C" aria-pressed="true">C大調</button>
        <button type="button" id="k-F" aria-pressed="false">F大調</button>
      </div>
      <button class="btn" id="clear" type="button">清除音符</button>
    </div>
    <div class="pads" id="pads"></div>
    <div id="self" class="panel" hidden>
      <span class="label">你的題目是幾度？小老師要先自己數一數：</span>
      <div class="choices" id="self-choices"></div>
      <p class="msg" id="self-msg"></p>
      <div><button class="big purple" id="go-ask" type="button" hidden>題目完成，去問同學 →</button></div>
    </div>
  </section>

  <!-- ② ask classmates -->
  <section class="panel" id="ask" hidden>
    <span class="label" id="ask-who">請第 1 位同學作答：</span>
    <div class="choices" id="ask-choices"></div>
    <div class="coach" id="coach" hidden>
      <h3>小老師，教一教同學！</h3>
      <ol id="coach-steps"></ol>
      <div><button class="big purple" id="retry" type="button">教完了，請同學再答一次</button></div>
    </div>
    <p class="msg" id="ask-msg"></p>
    <div><button class="big" id="next" type="button" hidden>下一位同學 →</button></div>
  </section>

  <section class="stats" id="stats" hidden>
    <h2>全班作答紀錄</h2>
    <div class="kpis">
      <div class="kpi"><span>已作答同學</span><b id="k-n">0</b></div>
      <div class="kpi main"><span>答對率</span><b id="k-rate">–</b></div>
      <div class="kpi"><span>第一次就答對</span><b id="k-first">0</b></div>
      <div class="kpi"><span>教完後答對</span><b id="k-second">0</b></div>
    </div>
    <div class="barwrap">
      <div class="bar" id="bar" aria-hidden="true"></div>
      <div class="legend">
        <span><i class="c-first"></i>第一次就答對</span>
        <span><i class="c-second"></i>教完後答對</span>
        <span><i class="c-miss"></i>未答對 <b id="k-miss">0</b></span>
      </div>
    </div>
    <div class="dots" id="dots"></div>
  </section>
</div>

<script>
const CLEF_PATH = "M434 2Q464 -103 464 -170Q464 -223 427.0 -257.0Q390 -291 337 -291Q287 -291 250.0 -261.5Q213 -232 213 -190Q213 -160 233.5 -133.5Q254 -107 283.5 -107.0Q313 -107 331.5 -128.5Q350 -150 350 -178Q350 -240 280 -240Q298 -268 338 -268Q353 -268 368.5 -263.5Q384 -259 401.0 -248.0Q418 -237 428.5 -213.5Q439 -190 439 -157Q439 -136 411 -6Q389 -12 356 -12Q259 -12 189.5 60.0Q120 132 120 232Q120 267 131.5 303.0Q143 339 157.5 366.5Q172 394 200.5 428.5Q229 463 248.5 483.5Q268 504 303 539Q280 621 280 689Q280 779 313.0 839.5Q346 900 379 900Q389 900 401.5 887.0Q414 874 426.0 851.0Q438 828 446.5 790.5Q455 753 455 710Q455 551 342 447L368 329Q384 332 397 332Q458 332 500.0 282.5Q542 233 542 162Q542 44 434 2ZM426 746Q426 801 394 801Q358 801 333.0 748.0Q308 695 308 630Q308 588 321 557Q359 580 392.5 639.5Q426 699 426 746ZM498 128Q498 183 466.0 216.0Q434 249 383 249L428 23Q498 52 498 128ZM407 17 361 247Q334 241 311.5 214.0Q289 187 289 158Q289 143 295.0 128.5Q301 114 309.5 104.0Q318 94 327.0 86.0Q336 78 342.0 74.5Q348 71 348 71L340 66Q307 75 277.5 106.0Q248 137 248 184Q248 231 277.5 270.5Q307 310 343 323L325 430Q168 299 168 177Q168 104 223.0 55.0Q278 6 348 6Q365 6 407 17Z";
const FLAT_PATH = "M222 441Q275 441 302.0 408.0Q329 375 329 317Q329 273 299.5 234.0Q270 195 192.5 117.0Q115 39 56 -34V783L99 802V402Q148 441 222 441ZM232 308Q232 373 183 373Q159 373 134.5 358.5Q110 344 99 319V87Q159 155 195.5 214.5Q232 274 232 308Z";
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const $ = id => document.getElementById(id);
const SOLFA = ["d", "r", "m", "f", "s", "l", "t", "d"];
const NUM_CN = ["一", "二", "三", "四", "五", "六", "七", "八"];
const PAD_COLORS = ["#ffd9d6", "#ffe5c7", "#fff2b8", "#dff2c9", "#cdeee6", "#d8e6fb", "#e8dcf8", "#ffd9d6"];
const KEYS = {
  C: { name: "C大調", baseStep: -2, letters: ["C", "D", "E", "F", "G", "A", "B", "C"], freqs: [261.63, 293.66, 329.63, 349.23, 392.0, 440.0, 493.88, 523.25] },
  F: { name: "F大調", baseStep: 1, letters: ["F", "G", "A", "B♭", "C", "D", "E", "F"], freqs: [349.23, 392.0, 440.0, 466.16, 523.25, 587.33, 659.25, 698.46] }
};
const SP = 24, BOTTOM = 190, QX = [250, 372];
const stepY = s => BOTTOM - s * SP / 2;

/* ---------- state ---------- */
const fresh = () => ({ key: "C", notes: [null, null], names: true, phase: "make", selfWrong: [], selfDone: false,
  turn: { tries: 2, wrong: [], done: false, coaching: false }, log: [] });
let st = fresh();
try {
  const saved = JSON.parse(localStorage.getItem("interval-teacher") || "null");
  if (saved && typeof saved.names === "boolean") st.names = saved.names;   // start with an empty staff; keep only the 唱名 setting
} catch (e) {}
function save() { try { localStorage.setItem("interval-teacher", JSON.stringify({ names: st.names })); } catch (e) {} }
let hover = null, confirmNew = false;

const both = () => st.notes[0] !== null && st.notes[1] !== null;
const answer = () => Math.abs(st.notes[0] - st.notes[1]) + 1;
const stepOf = d => KEYS[st.key].baseStep + d;

/* ---------- sound ---------- */
let actx = null;
function tone(freq, when = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + when, g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    g.connect(actx.destination);
    const o1 = actx.createOscillator(); o1.type = "sine"; o1.frequency.value = freq;
    const g2 = actx.createGain(); g2.gain.setValueAtTime(0.18, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    const o2 = actx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 4;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(t); o2.start(t); o1.stop(t + 1.2); o2.stop(t + 0.3);
  } catch (e) {}
}
function playPair() {
  const f = KEYS[st.key].freqs;
  if (st.notes[0] !== null) tone(f[st.notes[0]]);
  if (st.notes[1] !== null) tone(f[st.notes[1]], 0.6);
}

/* ---------- staff ---------- */
function head(g, x, y, color) {
  const n = el("g", { transform: `translate(${x} ${y})` }, g);
  el("ellipse", { rx: 14, ry: 10, fill: color }, n);
  el("ellipse", { rx: 6.5, ry: 4.6, fill: "#ffffff", transform: "rotate(-35)" }, n);
}
function ledger(g, x, step, color) {
  for (let s = -2; s >= step; s -= 2) el("line", { x1: x - 22, x2: x + 22, y1: stepY(s), y2: stepY(s), stroke: color, "stroke-width": 2 }, g);
  for (let s = 10; s <= step; s += 2) el("line", { x1: x - 22, x2: x + 22, y1: stepY(s), y2: stepY(s), stroke: color, "stroke-width": 2 }, g);
}
/* countUpTo: how many orange counting numbers to draw from the lower note (0 = none) */
function drawStaff(countUpTo = 0) {
  const svg = $("staff"), ink = "#23313b";
  svg.innerHTML = "";
  el("rect", { x: 0, y: 30, width: 460, height: 234, fill: "#ffffff" }, svg);
  for (let i = 0; i < 5; i++) el("line", { x1: 8, x2: 446, y1: stepY(i * 2), y2: stepY(i * 2), stroke: ink, "stroke-width": 1.6 }, svg);
  el("line", { x1: 438, x2: 438, y1: stepY(8), y2: stepY(0), stroke: ink, "stroke-width": 1.6 }, svg);
  el("rect", { x: 442, y: stepY(8), width: 5, height: SP * 4, fill: ink }, svg);
  const k = SP / 155;
  el("path", { d: CLEF_PATH, fill: ink, transform: `translate(2 ${stepY(2)}) scale(${k} ${-k}) translate(0 -160)` }, svg);
  let doX = 150;
  if (st.key === "F") {
    const kf = SP / 360;
    el("path", { d: FLAT_PATH, fill: ink, transform: `translate(96 ${stepY(4)}) scale(${kf} ${-kf}) translate(0 -205)` }, svg);
    doX = 162;
  }
  const base = KEYS[st.key].baseStep, dy = stepY(base);
  if (base <= -2) el("line", { x1: doX - 17, x2: doX + 17, y1: stepY(-2), y2: stepY(-2), stroke: ink, "stroke-width": 2 }, svg);
  el("rect", { x: doX - 12, y: dy - 12, width: 24, height: 24, rx: 4, fill: "#8a2f86" }, svg);
  const dt = el("text", { x: doX, y: dy + 6.5, "text-anchor": "middle", "font-family": "Lora, Georgia, serif", "font-style": "italic", "font-weight": 600, "font-size": 20, fill: "#ffffff" }, svg);
  dt.textContent = "d";

  st.notes.forEach((deg, i) => {
    const x = QX[i];
    if (deg === null) {
      if (st.phase === "make") {
        // red arrow above the staff: put note 1 / note 2 here
        const isNext = i === (st.notes[0] === null ? 0 : 1);
        const g = el("g", { opacity: isNext ? 1 : 0.35 }, svg);
        el("line", { x1: x, x2: x, y1: 38, y2: 70, stroke: "#d0342c", "stroke-width": 4, "stroke-linecap": "round" }, g);
        el("path", { d: `M${x - 9} 68 L${x + 9} 68 L${x} 82 Z`, fill: "#d0342c" }, g);
        const t = el("text", { x: x + 14, y: 54, "font-size": 18, "font-weight": 700, fill: "#d0342c" }, g);
        t.textContent = i + 1;
      }
      return;
    }
    const s = stepOf(deg);
    ledger(svg, x, s, ink);
    head(svg, x, stepY(s), ink);
    if (st.names) {
      const t = el("text", { x, y: 254, "text-anchor": "middle", "font-family": "Lora, Georgia, serif", "font-style": "italic", "font-weight": 600, "font-size": 26, fill: "#8a2f86" }, svg);
      t.textContent = SOLFA[deg];
      if (deg === 7) { const tick = el("tspan", { dx: 2, dy: -6, "font-size": 26, "font-style": "normal", "font-weight": 700, "font-family": "Arial, sans-serif" }, t); tick.textContent = "'"; }
    }
  });

  if (countUpTo > 0 && both()) {
    const [a, b] = st.notes, base2 = KEYS[st.key].baseStep;
    const lowX = a <= b ? QX[0] : QX[1], highX = a <= b ? QX[1] : QX[0];
    const lo = base2 + Math.min(a, b), n = Math.abs(a - b) + 1;
    const dir = highX > lowX ? 1 : -1, x0 = lowX + dir * 26, x1 = highX - dir * 26;
    for (let i = 0; i < Math.min(n, countUpTo); i++) {
      const x = x0 + (x1 - x0) * (n === 1 ? 0 : i / (n - 1)), y = stepY(lo + i);
      el("circle", { cx: x, cy: y, r: 8, fill: "#e8781e" }, svg);
      const t = el("text", { x, y: y + 4.5, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "#ffffff" }, svg);
      t.textContent = i + 1;
    }
  }
  if (hover) {
    const g = el("g", { opacity: 0.75, "pointer-events": "none" }, svg);
    ledger(g, hover.x, hover.step, "#5d6770");
    head(g, hover.x, stepY(hover.step), "#5d6770");
  }
}

/* ---------- render ---------- */
function choiceButtons(box, wrong, rightShown, disabled, onPick) {
  box.innerHTML = "";
  for (let n = 2; n <= 8; n++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice"; b.textContent = NUM_CN[n - 1] + "度";
    if (wrong.includes(n)) b.classList.add("wrong");
    if (rightShown === n) b.classList.add("right");
    b.disabled = disabled || wrong.includes(n);
    b.addEventListener("click", () => onPick(n));
    box.appendChild(b);
  }
}
function countFor() {
  if (st.phase === "ask" && st.turn.done && st.turn.tries === 0) return 99;     // full counting after a miss
  if (st.phase === "ask" && st.turn.coaching) return 2;                          // coaching: show 1 and 2 only
  return 0;
}
function render() {
  const ask = st.phase === "ask";
  $("ph-make").classList.toggle("on", !ask);
  $("ph-ask").classList.toggle("on", ask);
  $("names").checked = st.names;
  $("card-key").textContent = KEYS[st.key].name;
  $("card-title").textContent = ask ? `第 ${st.log.length + (st.turn.done ? 0 : 1)} 位同學` : "我的題目";
  $("make").hidden = ask;
  $("ask").hidden = !ask;
  $("stats").hidden = !ask;
  $("new-row").hidden = !ask;
  drawStaff(countFor());

  const showAns = (!ask && st.selfDone) || (ask && st.turn.done);
  $("blank").innerHTML = showAns ? NUM_CN[answer() - 1] : "&nbsp;";
  $("listen").disabled = st.notes[0] === null;
  $("tip").textContent = ask
    ? "把游標或手指放在五線譜上，灰色音符可以幫你一線一間地數。"
    : (both() ? "想改音符？在五線譜上點一下第一個或第二個音的位置。" : `在五線譜上點兩下，或用下面的唱名鍵，放上第 ${st.notes[0] === null ? 1 : 2} 個音。`);

  if (!ask) {
    ["C", "F"].forEach(k => $("k-" + k).setAttribute("aria-pressed", String(st.key === k)));
    const pads = $("pads"); pads.innerHTML = "";
    KEYS[st.key].letters.forEach((L, deg) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "pad"; b.style.background = PAD_COLORS[deg];
      b.disabled = both();
      b.innerHTML = `<span class="sf">${SOLFA[deg]}${deg === 7 ? "ˈ" : ""}</span><span class="ln">${L}</span>`;
      b.setAttribute("aria-label", `放上 ${L}`);
      b.addEventListener("click", () => placeNote(st.notes[0] === null ? 0 : 1, deg));
      pads.appendChild(b);
    });
    $("clear").disabled = st.notes[0] === null && st.notes[1] === null;
    $("self").hidden = !both();
    if (both()) {
      choiceButtons($("self-choices"), st.selfWrong, st.selfDone ? answer() : null, st.selfDone, pickSelf);
      $("go-ask").hidden = !st.selfDone;
    }
  } else {
    const n = st.log.length + (st.turn.done ? 0 : 1);
    $("ask-who").textContent = st.turn.done ? `第 ${st.log.length} 位同學完成了！` : `請第 ${n} 位同學作答：`;
    choiceButtons($("ask-choices"), st.turn.wrong, st.turn.done ? answer() : null, st.turn.done || st.turn.coaching, pickAsk);
    $("coach").hidden = !st.turn.coaching;
    if (st.turn.coaching) renderCoach();
    $("next").hidden = !st.turn.done;
    renderStats();
  }
  save();
}

/* ---------- ① make ---------- */
function placeNote(slot, deg) {
  if (slot === 1 && st.notes[0] === null) slot = 0;
  const other = st.notes[1 - slot];
  if (other !== null && other === deg) {
    $("tip").innerHTML = '<b style="color:#d0342c">兩個音不可以一樣，請選另一個音。</b>';
    tone(KEYS[st.key].freqs[deg]);
    return;
  }
  const wasBoth = both();
  st.notes[slot] = deg;
  st.selfWrong = []; st.selfDone = false;
  $("self-msg").textContent = "";
  tone(KEYS[st.key].freqs[deg]);
  render();
  if (!wasBoth && both()) $("self").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function lineOrSpace(step) { return step % 2 === 0 ? "線" : "間"; }
function parityText() {
  const s1 = stepOf(st.notes[0]), s2 = stepOf(st.notes[1]);
  const p1 = lineOrSpace(s1), p2 = lineOrSpace(s2), odd = p1 === p2;
  return { p1, p2, odd, text: `「${p1}到${p2}」是${odd ? "單數度（三、五、七）" : "雙數度（二、四、六、八）"}` };
}
function pickSelf(n) {
  const m = $("self-msg");
  if (n === answer()) {
    st.selfDone = true;
    m.className = "msg good";
    m.innerHTML = `答對了！你的題目是 <b>${NUM_CN[answer() - 1]}度</b>。記住怎樣數，等一下要教同學啊！`;
    playPair(); render(); popBlank();
  } else {
    st.selfWrong.push(n);
    m.className = "msg";
    m.innerHTML = `再數一次：由較低的音數起，<b>兩個音都要數</b>。這兩個音${parityText().text}。`;
    render();
  }
}
$("k-C").addEventListener("click", () => setKey("C"));
$("k-F").addEventListener("click", () => setKey("F"));
function setKey(k) { if (st.key === k) return; st.key = k; st.selfWrong = []; st.selfDone = false; $("self-msg").textContent = ""; render(); }
$("clear").addEventListener("click", () => { st.notes = [null, null]; st.selfWrong = []; st.selfDone = false; $("self-msg").textContent = ""; render(); });
$("go-ask").addEventListener("click", () => {
  st.phase = "ask"; st.turn = { tries: 2, wrong: [], done: false, coaching: false };
  $("ask-msg").textContent = ""; render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ---------- ② ask ---------- */
function pickAsk(n) {
  const t = st.turn, m = $("ask-msg");
  if (t.done || t.coaching) return;
  if (n === answer()) {
    t.done = true;
    const first = t.tries === 2;
    st.log.push(first ? "first" : "second");
    m.className = "msg good";
    m.innerHTML = first ? `第一次就答對了，好厲害！答案是 <b>${NUM_CN[answer() - 1]}度</b>。`
                        : `答對了！小老師教得好！答案是 <b>${NUM_CN[answer() - 1]}度</b>。`;
    playPair(); render(); popBlank(); showNext();
    return;
  }
  t.tries--; t.wrong.push(n);
  if (t.tries === 1) {
    t.coaching = true;
    m.textContent = "";
    render();
    $("coach").scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    t.done = true; st.log.push("miss");
    m.className = "msg plain";
    m.innerHTML = `答案是 <b>${NUM_CN[answer() - 1]}度</b>。小老師，和同學一起看着五線譜上的橙色數字，由 1 數到 ${answer()}。`;
    render(); popBlank(); showNext();
  }
}
function renderCoach() {
  const low = Math.min(...st.notes);
  const sf = d => SOLFA[d] + (d === 7 ? "'" : "");
  $("coach-steps").innerHTML = [
    `指着較低的音 <i>${sf(low)}</i>：<span class="say">「這是 1。」</span>`,
    `一線一間數上去，<b>兩個音都要數</b>。`,
    `請同學自己數，<b>不要說出答案</b>。`
  ].map(s => `<li>${s}</li>`).join("");
}
$("retry").addEventListener("click", () => {
  st.turn.coaching = false;
  $("ask-msg").className = "msg";
  $("ask-msg").textContent = "同學，請再答一次！";
  render();
});
$("next").addEventListener("click", () => {
  st.turn = { tries: 2, wrong: [], done: false, coaching: false };
  $("ask-msg").textContent = "";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
function showNext() { const n = $("next"); n.hidden = false; n.focus({ preventScroll: true }); }
function popBlank() { const b = $("blank"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }

/* ---------- stats ---------- */
function renderStats() {
  const n = st.log.length;
  const first = st.log.filter(x => x === "first").length;
  const second = st.log.filter(x => x === "second").length;
  const miss = n - first - second;
  $("k-n").textContent = n;
  $("k-rate").textContent = n ? Math.round((first + second) / n * 100) + "%" : "–";
  $("k-first").textContent = first;
  $("k-second").textContent = second;
  $("k-miss").textContent = miss;
  const bar = $("bar"); bar.innerHTML = "";
  if (n) [["c-first", first], ["c-second", second], ["c-miss", miss]].forEach(([c, v]) => {
    if (!v) return;
    const d = document.createElement("div"); d.className = c; d.style.width = (v / n * 100) + "%"; bar.appendChild(d);
  });
  const dots = $("dots"); dots.innerHTML = "";
  if (!n) { dots.innerHTML = '<p class="empty">還未有同學作答。</p>'; }
  st.log.forEach((r, i) => {
    const d = document.createElement("span");
    d.className = "dot " + (r === "first" ? "c-first" : r === "second" ? "c-second" : "c-miss");
    d.textContent = i + 1;
    d.title = `第 ${i + 1} 位：` + (r === "first" ? "第一次就答對" : r === "second" ? "教完後答對" : "未答對");
    dots.appendChild(d);
  });
  $("new-q").textContent = confirmNew ? "確定：清除紀錄並出新題目" : "出新題目";
  $("new-q-note").textContent = confirmNew ? "出新題目會清除這條題目的作答紀錄。" : "";
}
$("new-q").addEventListener("click", () => {
  if (!confirmNew) { confirmNew = true; renderStats(); setTimeout(() => { confirmNew = false; if (st.phase === "ask") renderStats(); }, 5000); return; }
  confirmNew = false;
  const names = st.names, key = st.key;
  st = fresh(); st.names = names; st.key = key;
  $("self-msg").textContent = ""; $("ask-msg").textContent = "";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ---------- misc events ---------- */
$("names").addEventListener("change", () => { st.names = $("names").checked; render(); });
$("listen").addEventListener("click", playPair);
const staff = $("staff");
function svgPoint(evt) {
  const p = staff.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(staff.getScreenCTM().inverse());
}
function hoverFrom(e) {
  const p = svgPoint(e);
  const lo = st.phase === "make" ? KEYS[st.key].baseStep : -3, hi = st.phase === "make" ? KEYS[st.key].baseStep + 7 : 10;
  const step = Math.max(lo, Math.min(hi, Math.round((BOTTOM - p.y) / (SP / 2))));
  if (st.phase === "make") {
    if (p.x < 195) return null;
    let slot = Math.abs(p.x - QX[0]) <= Math.abs(p.x - QX[1]) ? 0 : 1;
    if (slot === 1 && st.notes[0] === null) slot = 0;
    return { x: QX[slot], step, slot };
  }
  return { x: Math.max(205, Math.min(415, p.x)), step };
}
["pointerdown", "pointermove"].forEach(ev => staff.addEventListener(ev, e => {
  const h = hoverFrom(e);
  if (JSON.stringify(h) !== JSON.stringify(hover)) { hover = h; drawStaff(countFor()); }
}));
staff.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { hover = null; drawStaff(countFor()); } });
staff.addEventListener("click", e => {
  if (st.phase !== "make") return;
  const h = hoverFrom(e);
  if (!h) return;
  placeNote(h.slot, h.step - KEYS[st.key].baseStep);
});

/* restore messages after a reload */
if (st.phase === "make" && st.selfDone) { $("self-msg").className = "msg good"; $("self-msg").innerHTML = `你的題目是 <b>${NUM_CN[answer() - 1]}度</b>。`; }
render();
</script>

</body>
</html>
